# The engine at precision=double, for the three hosts the rung runs on (RFD66606-2293):
# windows x86_64 (the Steam Frame through its compatibility layer), linux x86_64
# (the Fly ghost servers, headless) and macos arm64 (the desk, the desktop client
# and the GPU sidecar). Editor and template_release each. Nothing is built by hand.
#
# A release tag is the tagged commit's Go pseudo-version, computed, never typed
# (RFD66606-2312): the tagged commit's UTC committer time as YYYYMMDDhhmmss,
# then the first 12 hex digits of the commit, so it sorts by time in a file
# listing and parses in every package tool:
#   TZ=UTC git log -1 --format='v0.0.0-%cd-%h' \
#     --date=format-local:%Y%m%d%H%M%S --abbrev=12
# A stage, a rung name or a "1.0" goes in the release title and the stage branch,
# not in the tag. Run `elixir scripts/check_release_tags.exs` to recompute every
# tag; the pen's CITATION.cff cites the tag.
name: double

on:
  workflow_dispatch:
    inputs:
      engine_ref:
        description: entities-zone commit to build
        default: c07557101539892d9f04764a2d023e24f5ad5756
        required: true
      release_tag:
        description: the release tag, the tagged commit's Go pseudo-version (v0.0.0-YYYYMMDDhhmmss-<12-hex>, RFD66606-2312)
        default: "v0.0.0-20261111025605-c07557101539"
        required: true
  push:
    tags: ["v0.0.0-*-*"]

env:
  ENGINE_REPO: V-Sekai-fire/entities-zone
  ENGINE_REF: ${{ inputs.engine_ref || '870268b512b713f28d8628ab63d9316cdaf55cfd' }}
  LLVM_MINGW: "20260922"
  # The flags every job shares. No dev_mode: these are the binaries the rung
  # runs, not a lint of the engine. AccessKit is on, from the SDK the engine's
  # install_accesskit.py fetches; a failed fetch fails the job. Debug symbols are
  # on in every build, split beside the binary (RFD66606-2287 step 1).
  SCONS_FLAGS: >-
    precision=double
    module_text_server_fb_enabled=yes
    module_sqlite_enabled=no
    optimize=speed
    d3d12=no
    angle=no
    accesskit=yes
    debug_symbols=yes
    separate_debug_symbols=yes

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: editor
            cache-name: windows-editor-double
            flags: debug_symbols=no
            bin: godot.windows.editor.double.x86_64.llvm.exe
          - target: template_release
            cache-name: windows-template-double
            # Symbols on, for the StringName fault RFD66606-2287 step 1 diagnoses.
            flags: debug_symbols=yes separate_debug_symbols=yes
            bin: godot.windows.template_release.double.x86_64.llvm.exe
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          submodules: recursive
      - name: Restore the SCons cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true
      - uses: ./.github/actions/godot-deps
      - name: AccessKit SDK
        # The engine only warns and drops AccessKit when the SDK is missing, so a
        # failed fetch must fail here, and the path is passed explicitly.
        shell: bash
        run: |
          python3 misc/scripts/install_accesskit.py || python misc/scripts/install_accesskit.py
          for d in "bin/build_deps/accesskit" "${LOCALAPPDATA:-/nonexistent}/Godot/build_deps/accesskit"; do
            if [ -d "$d/include" ]; then
              if command -v cygpath > /dev/null; then sdk=$(cygpath -m "$d"); else sdk=$(cd "$d" && pwd); fi
              echo "ACCESSKIT_SDK=$sdk" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::AccessKit SDK not found after install"
          exit 1
      - name: llvm-mingw, the compiler the headset build used
        shell: sh
        run: |
          ver=$LLVM_MINGW
          curl -fsSL -o llvm-mingw.zip "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/llvm-mingw-$ver-ucrt-x86_64.zip"
          7z x -y llvm-mingw.zip > /dev/null
          echo "MINGW_PREFIX=$PWD/llvm-mingw-$ver-ucrt-x86_64" >> "$GITHUB_ENV"
          echo "$PWD/llvm-mingw-$ver-ucrt-x86_64/bin" >> "$GITHUB_PATH"
      - name: Compile
        uses: ./.github/actions/godot-build
        with:
          platform: windows
          target: ${{ matrix.target }}
          scons-flags: ${{ env.SCONS_FLAGS }} accesskit_sdk_path=${{ env.ACCESSKIT_SDK }} arch=x86_64 use_mingw=yes use_llvm=yes mingw_prefix=${{ env.MINGW_PREFIX }}
      - name: Save the SCons cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true
      - name: The binary runs
        shell: sh
        run: |
          ls -l bin/
          test -f "bin/${{ matrix.bin }}"
          if [ "${{ matrix.target }}" = editor ]; then ./bin/${{ matrix.bin }} --headless --version; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cache-name }}
          path: bin/godot.*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: editor
            cache-name: linux-editor-double
            flags: debug_symbols=no
            bin: godot.linuxbsd.editor.double.x86_64
          - target: template_release
            cache-name: linux-template-double
            flags: debug_symbols=no
            bin: godot.linuxbsd.template_release.double.x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          submodules: recursive
      - name: Room for a debug-symbol build
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost && df -h .
      - name: wayland-scanner, the one library the engine cannot wrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwayland-bin
      - name: Restore the SCons cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true
      - uses: ./.github/actions/godot-deps
      - name: AccessKit SDK
        # The engine only warns and drops AccessKit when the SDK is missing, so a
        # failed fetch must fail here, and the path is passed explicitly.
        shell: bash
        run: |
          python3 misc/scripts/install_accesskit.py || python misc/scripts/install_accesskit.py
          for d in "bin/build_deps/accesskit" "${LOCALAPPDATA:-/nonexistent}/Godot/build_deps/accesskit"; do
            if [ -d "$d/include" ]; then
              if command -v cygpath > /dev/null; then sdk=$(cygpath -m "$d"); else sdk=$(cd "$d" && pwd); fi
              echo "ACCESSKIT_SDK=$sdk" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::AccessKit SDK not found after install"
          exit 1
      - name: Compile
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: ${{ matrix.target }}
          scons-flags: ${{ env.SCONS_FLAGS }} accesskit_sdk_path=${{ env.ACCESSKIT_SDK }} arch=x86_64
      - name: Save the SCons cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true
      - name: The binary runs headless
        run: |
          ls -l bin/
          test -f "bin/${{ matrix.bin }}"
          if [ "${{ matrix.target }}" = editor ]; then ./bin/${{ matrix.bin }} --headless --version; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cache-name }}
          path: bin/godot.*
          if-no-files-found: error

  macos:
    runs-on: macos-26
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: editor
            cache-name: macos-editor-double
            flags: debug_symbols=no
            bin: godot.macos.editor.double.arm64
          - target: template_release
            cache-name: macos-template-double
            flags: debug_symbols=no
            bin: godot.macos.template_release.double.arm64
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          submodules: recursive
      - name: Restore the SCons cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true
      - uses: ./.github/actions/godot-deps
      - name: AccessKit SDK
        # The engine only warns and drops AccessKit when the SDK is missing, so a
        # failed fetch must fail here, and the path is passed explicitly.
        shell: bash
        run: |
          python3 misc/scripts/install_accesskit.py || python misc/scripts/install_accesskit.py
          for d in "bin/build_deps/accesskit" "${LOCALAPPDATA:-/nonexistent}/Godot/build_deps/accesskit"; do
            if [ -d "$d/include" ]; then
              if command -v cygpath > /dev/null; then sdk=$(cygpath -m "$d"); else sdk=$(cd "$d" && pwd); fi
              echo "ACCESSKIT_SDK=$sdk" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::AccessKit SDK not found after install"
          exit 1
      - name: Vulkan SDK (MoltenVK), beside Metal
        id: vulkan-sdk
        run: |
          if sh misc/scripts/install_vulkan_sdk_macos.sh; then
            echo "VULKAN_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS: Vulkan SDK installation failed, building without Vulkan support."
            echo "VULKAN_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true
      - name: Compile
        uses: ./.github/actions/godot-build
        with:
          platform: macos
          target: ${{ matrix.target }}
          scons-flags: ${{ env.SCONS_FLAGS }} accesskit_sdk_path=${{ env.ACCESSKIT_SDK }} arch=arm64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }}
      - name: Save the SCons cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true
      - name: The binary runs headless
        run: |
          ls -l bin/
          test -f "bin/${{ matrix.bin }}"
          if [ "${{ matrix.target }}" = editor ]; then ./bin/${{ matrix.bin }} --headless --version; fi
      - name: Zip the dSYM, so the release flatten keeps it whole
        run: |
          cd bin
          for d in godot.*.dSYM; do [ -d "$d" ] || continue; ditto -c -k --keepParent "$d" "$d.zip"; rm -rf "$d"; done
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cache-name }}
          path: bin/godot.*
          if-no-files-found: error

  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: One directory, one sha256 line per binary
        run: |
          mkdir -p release
          find out -type f -exec mv -t release/ {} +
          cd release && sha256sum * | tee SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.release_tag || github.ref_name }}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" \
            --notes "entities-zone ${ENGINE_REF} at precision=double: windows x86_64 (llvm-mingw ${LLVM_MINGW}), linux x86_64, macos arm64; editor and template_release. Flags: ${SCONS_FLAGS}" \
            release/* || gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber release/*
