# The godot-sandbox addon at precision=double with BINTR_EMIT, for the rung's
# three hosts (RFD 2293 step 1). Each library is the one the pen's
# .gdextension already maps. A tag v<date>-addon.N publishes them as a release.
name: addon

on:
  workflow_dispatch:
    inputs:
      addon_ref:
        description: godot-sandbox commit (b1118e5 merged with bintr-emit)
        default: ade650e9e902a340e8f8803c570ed11a9ba9d643
        required: true
      release_tag:
        description: publish a release under this tag (empty for artifacts only)
        default: ""
  push:
    tags: ["v*-addon.*"]

env:
  ADDON_REPO: V-Sekai-fire/godot-sandbox
  ADDON_REF: ${{ inputs.addon_ref || 'ade650e9e902a340e8f8803c570ed11a9ba9d643' }}
  LLVM_MINGW: "20260922"
  SCONS_FLAGS: >-
    precision=double
    target=template_release

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ADDON_REPO }}
          ref: ${{ env.ADDON_REF }}
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scons
      - name: llvm-mingw
        shell: sh
        run: |
          ver=$LLVM_MINGW
          curl -fsSL -o llvm-mingw.zip "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/llvm-mingw-$ver-ucrt-x86_64.zip"
          7z x -y llvm-mingw.zip > /dev/null
          echo "$PWD/llvm-mingw-$ver-ucrt-x86_64/bin" >> "$GITHUB_PATH"
      - name: Compile
        run: scons ${{ env.SCONS_FLAGS }} platform=windows arch=x86_64 use_mingw=yes use_llvm=yes
      - name: Stage the library
        shell: sh
        run: mkdir -p stage && cp bin/addons/godot_sandbox/bin/libgodot_riscv.windows.template_release.double.x86_64.dll stage/ && ls -l stage
      - uses: actions/upload-artifact@v4
        with:
          name: addon-windows-double
          path: stage/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ADDON_REPO }}
          ref: ${{ env.ADDON_REF }}
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scons
      - name: Compile
        run: scons ${{ env.SCONS_FLAGS }} platform=linux arch=x86_64
      - name: Stage the library
        run: mkdir -p stage && cp bin/addons/godot_sandbox/bin/libgodot_riscv.linux.template_release.double.x86_64.so stage/ && ls -l stage
      - uses: actions/upload-artifact@v4
        with:
          name: addon-linux-double
          path: stage/*
          if-no-files-found: error

  macos:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ADDON_REPO }}
          ref: ${{ env.ADDON_REF }}
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scons
      - name: Compile
        run: scons ${{ env.SCONS_FLAGS }} platform=macos arch=universal
      # A release is flat, so the framework travels as its binary and its Info.plist.
      - name: Stage the library
        run: |
          f=bin/addons/godot_sandbox/bin/libgodot_riscv.macos.template_release.double.universal.framework
          mkdir -p stage
          cp "$f/libgodot_riscv.macos.template_release.double.universal" stage/
          cp "$f/Resources/Info.plist" stage/libgodot_riscv.macos.template_release.double.universal.Info.plist
          lipo stage/libgodot_riscv.macos.template_release.double.universal -verify_arch arm64 x86_64
          ls -l stage
      - uses: actions/upload-artifact@v4
        with:
          name: addon-macos-double
          path: stage/*
          if-no-files-found: error

  release:
    needs: [windows, linux, macos]
    if: ${{ inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Flatten and hash
        run: |
          mkdir -p release
          find out -type f -exec cp -t release/ {} +
          cd release && sha256sum * | tee SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.release_tag || github.ref_name }}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" \
            --notes "godot-sandbox ${ADDON_REF} at precision=double: windows x86_64 (llvm-mingw ${LLVM_MINGW}), linux x86_64, macos universal; template_release. Flags: ${SCONS_FLAGS}" \
            release/* || gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber release/*
